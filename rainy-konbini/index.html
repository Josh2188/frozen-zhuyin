<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="雨夜のコンビニ：用 Three.js 做的雨夜日本便利店，點地面讓撐透明傘的女生走過去。">
<title>雨夜のコンビニ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: full-bleed WebGL night scene; UI sits in the corners like stickers on shop glass. Single dark look by design. */
:root {
  --night: #0a1019;
  --ink: #edf2f7;
  --ink-dim: #9eb0c4;
  --amber: #f0a032;
  --teal: #2fb3aa;
  --chip: rgba(12, 20, 31, 0.66);
  --chip-line: rgba(180, 208, 236, 0.16);
  --bubble: #fbfaf6;
  --bubble-ink: #1e2a33;
  --f-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-jp: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", "Noto Sans TC", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--night); color: var(--ink); overflow: hidden; }
body { font-family: var(--f-ui); -webkit-font-smoothing: antialiased; touch-action: none; user-select: none; -webkit-user-select: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; outline: none; }
#c:focus-visible { box-shadow: inset 0 0 0 2px var(--amber); }

.title {
  position: fixed; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 14px);
  pointer-events: none; display: grid; gap: 2px;
}
.title h1 {
  margin: 0; font: 700 clamp(20px, 2.6vw, 28px)/1.15 var(--f-jp); letter-spacing: 0.06em;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
}
.title p { margin: 0; font: 500 12px/1.4 var(--f-jp); color: var(--ink-dim); letter-spacing: 0.14em; }
.title p b { color: var(--amber); font-weight: 700; }

.controls {
  position: fixed; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 14px);
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
}
.controls button {
  font: 500 13px/1 var(--f-ui); color: var(--ink); background: var(--chip);
  border: 1px solid var(--chip-line); border-radius: 999px; padding: 9px 14px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
}
.controls button:hover { border-color: rgba(240, 160, 50, 0.55); }
.controls button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.controls .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-dim); opacity: 0.6; }
.controls button[aria-pressed="true"] .dot { background: var(--teal); opacity: 1; box-shadow: 0 0 8px var(--teal); }

.hint {
  position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  margin: 0; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none;
  transition: opacity 0.8s ease;
}
.hint span {
  font: 400 12.5px/1 var(--f-ui); color: var(--ink-dim); background: var(--chip);
  border: 1px solid var(--chip-line); border-radius: 6px; padding: 7px 10px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.hint span b { color: var(--ink); font-weight: 500; }
.hint.faded { opacity: 0.35; }

#bubbles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.bubble {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -100%);
  font: 700 13px/1.3 var(--f-jp); color: var(--bubble-ink); background: var(--bubble);
  padding: 6px 11px; border-radius: 12px; white-space: nowrap;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); opacity: 0; transition: opacity 0.25s ease;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px;
  border: 6px solid transparent; border-bottom: 0; border-top-color: var(--bubble);
}
.bubble.sfx { background: transparent; box-shadow: none; color: var(--amber); font-size: 18px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.bubble.sfx::after { display: none; }
.bubble.show { opacity: 1; }

#loading {
  position: fixed; inset: 0; display: grid; place-items: center; background: var(--night);
  font: 500 15px/1 var(--f-jp); color: var(--ink-dim); letter-spacing: 0.2em; transition: opacity 0.9s ease;
}
#loading.done { opacity: 0; pointer-events: none; }
#loading.err { letter-spacing: 0.02em; padding-inline: 16px; text-align: center; line-height: 1.6; }

@media (max-width: 560px) {
  .title p { font-size: 11px; }
  .hint span { font-size: 11.5px; padding: 6px 8px; }
  .controls button { padding: 8px 11px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .bubble, .hint, #loading { transition: none; }
}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="雨夜的便利店 3D 場景。點地面讓她走過去。"></canvas>

  <h1>雨夜のコンビニ</h1>

</p>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const loadingEl = document.getElementById('loading');
const hot = window.claude?.hot;
const boot = (data) => start(data || {}).catch((err) => {
  console.error(err);
  loadingEl.classList.add('err');
  loadingEl.textContent = '這台裝置無法啟動 3D 場景（需要 WebGL2）。換一個瀏覽器或裝置再試試看。';
});
if (hot?.ready) hot.ready(boot); else boot(hot?.data ?? {});

async function start(saved) {
  // ---------------------------------------------------------------- fonts
  const FONT_SAMPLE = 'あまやどりマートコンビニエンスストア24HOPEN止まれおでんはじめましたホットコーヒー100円からあげ揚げたてATM自動ドアお菓子日用品カップ麺ソフトドリンクお茶水おにぎり弁当お手洗いつめた～いあったか～い町丁目冬の味時間営業新商品肉まんスナック雫ラーメン居酒屋缶ペットもえるゴミ';
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load('700 64px "Zen Maru Gothic"', FONT_SAMPLE),
        document.fonts.load('500 64px "Zen Maru Gothic"', FONT_SAMPLE),
      ]),
      new Promise((r) => setTimeout(r, 2500)),
    ]);
  } catch (e) { /* fall back to system fonts */ }

  // ---------------------------------------------------------------- utils
  let seed = 20261011;
  const rand = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const R = (a, b) => a + (b - a) * rand();
  const pick = (arr) => arr[(rand() * arr.length) | 0];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
  const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------------------------------------------------------------- renderer
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  if (!renderer.capabilities.isWebGL2) throw new Error('WebGL2 required');
  const coarse = matchMedia('(pointer: coarse)').matches;
  let DPR = Math.min(window.devicePixelRatio || 1, coarse ? 1.3 : 1.6);
  renderer.setPixelRatio(DPR);
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.85;
  RectAreaLightUniformsLib.init();

  const scene = new THREE.Scene();
  const FOG = 0.026;
  scene.fog = new THREE.FogExp2(0x16255a, FOG);
  const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 600);
  camera.position.set(4, 5, 12);

  const rt = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: coarse ? 2 : 4, depthTexture: new THREE.DepthTexture(4, 4) });
  const composer = new EffectComposer(renderer, rt);
  // the cloned ping-pong target would share its depth texture's GL storage → give it its own, or the ink pass reads what it writes
  composer.renderTarget2.depthTexture = new THREE.DepthTexture(4, 4);
  composer.setPixelRatio(DPR);
  composer.setSize(innerWidth, innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  // anime line art: ink where depth creases or jumps (Laplacian of linear depth), fading with distance
  const inkMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, tDepth: { value: null }, uTexel: { value: new THREE.Vector2() }, uNear: { value: camera.near }, uFar: { value: camera.far }, uInk: { value: new THREE.Color(0x231a22) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: `
      uniform sampler2D tDiffuse, tDepth; uniform vec2 uTexel; uniform float uNear, uFar; uniform vec3 uInk; varying vec2 vUv;
      float lin(vec2 uv){ float z = texture2D(tDepth, uv).x * 2.0 - 1.0; return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear)); }
      void main(){
        vec4 col = texture2D(tDiffuse, vUv);
        float c = lin(vUv);
        float l = lin(vUv - vec2(uTexel.x, 0.0)), r = lin(vUv + vec2(uTexel.x, 0.0)), d = lin(vUv - vec2(0.0, uTexel.y)), u = lin(vUv + vec2(0.0, uTexel.y));
        float crease = smoothstep(0.015, 0.045, (abs(l + r - 2.0 * c) + abs(u + d - 2.0 * c)) / c);
        float jump = smoothstep(0.06, 0.14, max(max(abs(l - c), abs(r - c)), max(abs(u - c), abs(d - c))) / c);
        float edge = max(crease, jump) * (1.0 - smoothstep(12.0, 28.0, c));
        // thin, light lines: darken the surface colour itself (grey on white, barely visible on dark surfaces)
        col.rgb = mix(col.rgb, col.rgb * 0.42 + uInk * 0.04, edge * 0.6);
        gl_FragColor = col;
      }`,
    depthTest: false, depthWrite: false,
  });
  class InkPass extends Pass {
    constructor() { super(); this.fsQuad = new FullScreenQuad(inkMat); }
    render(r, writeBuffer, readBuffer) {
      inkMat.uniforms.tDiffuse.value = readBuffer.texture;
      inkMat.uniforms.tDepth.value = readBuffer.depthTexture;
      inkMat.uniforms.uTexel.value.set(1.0 / readBuffer.width, 1.0 / readBuffer.height);
      r.setRenderTarget(this.renderToScreen ? null : writeBuffer); this.fsQuad.render(r);
    }
  }
  composer.addPass(new InkPass());
  const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.38, 0.45, 1.0);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.8, metalness: 0 }, o));
  const statics = [];
  function box(x0, x1, y0, y1, z0, z1, mat, parent = scene) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0)), mat);
    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    parent.add(m);
    if (parent === scene && !Array.isArray(mat)) statics.push(m);
    return m;
  }
  function cyl(rt_, rb, h, x, y, z, mat, seg = 16, parent = scene) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt_, rb, h, seg), mat);
    m.position.set(x, y, z); parent.add(m);
    if (parent === scene) statics.push(m);
    return m;
  }
  function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
  function mkTex(c, { srgb = true, repeat = false } = {}) {
    const t = new THREE.CanvasTexture(c);
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = maxAniso;
    if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }
  const JP = '"Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif';
  function txt(g, s, x, y, size, color, { weight = 700, align = 'center', base = 'middle', spacing = 0 } = {}) {
    g.font = `${weight} ${size}px ${JP}`; g.fillStyle = color; g.textAlign = align; g.textBaseline = base;
    if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
    g.fillText(s, x, y);
    if ('letterSpacing' in g) g.letterSpacing = '0px';
  }
  function vtxt(g, s, x, y, size, color, gap = 1.05) {
    [...s].forEach((ch, i) => txt(g, ch, x, y + i * size * gap, size, color));
  }
  function rrect(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
  function scaleBoxUV(geo, w, h, d, mu, mv) {
    const uv = geo.attributes.uv;
    const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
    for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) {
      const k = f * 4 + i;
      if (f === 2 || f === 3) { uv.setXY(k, 0.002, 0.998); continue; }
      uv.setXY(k, uv.getX(k) * dims[f][0] / mu, uv.getY(k) * dims[f][1] / mv);
    }
    uv.needsUpdate = true;
  }

  const GLSL_HASH = `
    float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
  `;

  // ---------------------------------------------------------------- shared materials
  const MAT = {
    wall: std(0xefede7, { roughness: 0.9, emissive: 0x585651 }),
    ceil: std(0xe9e7e1, { roughness: 0.95, emissive: 0x3a3733 }),
    metal: std(0x2b3038, { roughness: 0.45, metalness: 0.55 }),
    metalLight: std(0xc9cdd2, { roughness: 0.35, metalness: 0.6 }),
    shelf: std(0xeef0f2, { roughness: 0.75, metalness: 0.0, emissive: 0x434548 }),
    shelfDark: std(0x50565e, { roughness: 0.6 }),
    wood: std(0x9a7653, { roughness: 0.7 }),
    teal: std(0x14857f, { roughness: 0.55 }),
    glass: new THREE.MeshStandardMaterial({ color: 0xa9c3d6, transparent: true, opacity: 0.1, roughness: 0.05, metalness: 0.3, depthWrite: false, side: THREE.DoubleSide }),
    lightPanel: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffe9cc, emissiveIntensity: 2.4 }),
    facade: std(0x2f343b, { roughness: 0.55, metalness: 0.35 }),
    black: std(0x101216, { roughness: 0.6 }),
    white: std(0xf0f0ee, { roughness: 0.5 }),
    concrete: std(0x7a7d81, { roughness: 0.95 }),
    pole: std(0x8b8e90, { roughness: 0.9 }),
    darkGlass: std(0x0d1218, { roughness: 0.1, metalness: 0.7 }),
  };

  // ---------------------------------------------------------------- sky
  const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
    fragmentShader: `varying vec3 vDir;
      void main(){
        float h = vDir.y;
        vec3 top = vec3(0.006, 0.012, 0.055);
        vec3 hor = vec3(0.022, 0.045, 0.16);
        vec3 col = mix(hor, top, smoothstep(0.0, 0.55, h));
        col += vec3(0.05, 0.05, 0.12) * exp(-max(h, 0.0) * 9.0);
        gl_FragColor = vec4(col, 1.0);
      }`,
  }));
  sky.userData.nopick = true;
  scene.add(sky);

  // ---------------------------------------------------------------- lights
  scene.add(new THREE.HemisphereLight(0x5a7ee0, 0x1a2550, 0.9));
  const ceilLight = new THREE.RectAreaLight(0xffe2bc, 1.2, 11.4, 7.8);
  ceilLight.position.set(0, 2.96, -4.2); ceilLight.lookAt(0, 0, -4.2); scene.add(ceilLight);
  const spill = new THREE.RectAreaLight(0xffc98c, 1.35, 11.6, 2.6);
  spill.position.set(0, 1.35, 0.03); spill.lookAt(0, 1.35, 6); scene.add(spill);
  const vendLight = new THREE.PointLight(0xdcefff, 3, 6, 1.6); vendLight.position.set(7.5, 1.3, 1.6); scene.add(vendLight);
  const barLight = new THREE.PointLight(0xff4f9a, 5, 7, 1.8); barLight.position.set(-9.6, 3.2, 0.9); scene.add(barLight);
  const girlFill = new THREE.PointLight(0xeef2ff, 1.8, 4.5, 2); scene.add(girlFill);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const keyLight = new THREE.SpotLight(0xffe4c8, 7, 6.5, 0.62, 0.85, 1.4);
  keyLight.castShadow = true; keyLight.shadow.mapSize.set(1024, 1024); keyLight.shadow.bias = -0.0004; keyLight.shadow.normalBias = 0.02;
  keyLight.shadow.camera.near = 0.4; keyLight.shadow.camera.far = 6.5;
  scene.add(keyLight, keyLight.target);

  // ================================================================ GROUND
  const G = { x0: -32, z0: 0, w: 64, d: 32, ppm: 32 };
  const gx = (x) => (x - G.x0) * G.ppm, gz = (z) => (z - G.z0) * G.ppm;
  const puddleDefs = [
    [2.4, 1.55, 1.7, 0.75], [-3.7, 1.35, 0.95, 0.5], [-5.2, 4.45, 1.6, 0.55], [6.2, 4.3, 1.3, 0.5],
    [-11, 4.55, 1.4, 0.5], [0.6, 6.0, 2.6, 1.25], [-6.8, 8.6, 1.9, 1.0], [8.6, 9.3, 2.1, 1.0],
    [14.2, 6.0, 1.8, 0.9], [-14.5, 6.8, 2.2, 1.0], [3.6, 12.5, 1.5, 0.55], [-8.6, 12.6, 1.3, 0.5],
    [-1.6, 9.7, 1.2, 0.7], [11.2, 1.9, 1.1, 0.5], [-17.5, 2.0, 1.2, 0.5], [19, 8.4, 2.0, 0.9],
  ];
  const blobs = [];
  for (const [cx, cz, rx, rz] of puddleDefs) {
    const n = 4 + ((rand() * 3) | 0);
    for (let i = 0; i < n; i++) {
      blobs.push({ x: cx + R(-0.45, 0.45) * rx, z: cz + R(-0.45, 0.45) * rz, rx: rx * R(0.45, 0.85), rz: rz * R(0.45, 0.85), a: R(-0.4, 0.4) });
    }
  }
  function drawBlobs(g, ppm, inner, outer) {
    for (const b of blobs) {
      g.save();
      g.translate((b.x - G.x0) * ppm, (b.z - G.z0) * ppm);
      g.rotate(b.a);
      g.scale(b.rx * ppm, b.rz * ppm);
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
      gr.addColorStop(0, inner); gr.addColorStop(0.55, inner); gr.addColorStop(1, outer);
      g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 1, 0, Math.PI * 2); g.fill();
      g.restore();
    }
  }

  // --- puddle mask (also read on the CPU for footsteps)
  const MPPM = 16;
  const [maskC, mg] = mkCanvas(G.w * MPPM, G.d * MPPM);
  mg.fillStyle = 'rgb(46,46,46)'; mg.fillRect(0, 0, maskC.width, maskC.height);
  mg.globalCompositeOperation = 'lighter';
  drawBlobs(mg, MPPM, 'rgba(255,255,255,0.75)', 'rgba(255,255,255,0)');
  mg.globalCompositeOperation = 'source-over';
  const maskData = mg.getImageData(0, 0, maskC.width, maskC.height).data;
  const maskTex = mkTex(maskC, { srgb: false });
  function puddleAt(x, z) {

      uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vWorld;

      uniform vec3 color; uniform sampler2D tDiffuse; uniform sampler2D tMask;

      varying vec4 vUv; varying vec3 vWorld;
      ${GLSL_HASH}
      vec2 ripples(vec2 p, float t){
        vec2 cell = floor(p); vec2 acc = vec2(0.0);
        for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
          vec2 c = cell + vec2(float(i), float(j));
          vec2 h = hash22(c);
          float tt = fract(t * 0.85 + hash12(c * 1.37 + 4.1));

        }
        return acc;
      }
      void main(){
        vec2 muv = vec2((vWorld.x - uRect.x) / uRect.z, 1.0 - (vWorld.z - uRect.y) / uRect.w);
        float m = texture2D(tMask, muv).r;
        float pud = smoothstep(0.40, 0.55, m);
        vec2 n = (ripples(vWorld.xz * 3.2, uTime) + 0.6 * ripples(vWorld.xz * 4.7 + 13.1, uTime * 1.13 + 0.37)) * uRain;
        n *= mix(0.35, 1.0, pud);
        for (int i = 0; i < 8; i++) {
          vec4 s = uSteps[i]; float age = uTime - s.z;
          if (age > 0.0 && age < 2.5) {
            vec2 d = vWorld.xz - s.xy; float dist = length(d);
            float x = dist - age * 0.5;
            float wave = sin(x * 38.0) * smoothstep(-0.3, -0.1, x) * smoothstep(0.03, -0.08, x) * exp(-age * 1.6) * s.w;
            n += d / max(dist, 1e-3) * wave * 1.6;
          }
        }
        vec3 V = normalize(cameraPosition - vWorld);
        float fres = 0.3 + 0.7 * pow(1.0 - clamp(V.y, 0.0, 1.0), 2.5);
        float rough = 1.0 - pud;
        vec4 uv = vUv;

        vec3 col = vec3(0.0); float tot = 0.0;
        for (int k = -4; k <= 4; k++) {

        col *= exp(-uFog * uFog * dist * dist);
        gl_FragColor = vec4(col * color, 1.0);
      }`,
  };

    m.onBeforeCompile = (sh) => {

  #ifdef USE_EMISSIVEMAP
  vEmissiveMapUv = (vEmissiveMapUv + tileOff) / vec2(${cols}.0, ${rows}.0);

    };

      for (const i of idxs) {

        if (face === 0 || face === 1) uv.setXY(i, u * 0.05, v);
        else if (face === 2 || face === 3) { if (!(topFull && face === 2)) uv.setXY(i, u, 0.96 + v * 0.04); }

    const sway = reduceMotion ? 0 : Math.sin(clock * 0.11) * 0.025;
    cam.yaw = damp(cam.yaw, cam.tYaw + sway, 5, dt);
    cam.target.x = damp(cam.target.x, S.pos.x, 3, dt);
    cam.target.y = cam.ty ?? 1.15;
    cam.target.z = damp(cam.target.z, S.pos.z, 3, dt);
    const cp = Math.cos(cam.pitch);
    camGoal.set(cam.target.x + cam.dist * cp * Math.sin(cam.yaw), cam.target.y + cam.dist * Math.sin(cam.pitch), cam.target.z + cam.dist * cp * Math.cos(cam.yaw));
    if (inside) { camGoal.x = clamp(camGoal.x, -5.5, 5.5); camGoal.y = Math.min(camGoal.y, 2.7); camGoal.z = clamp(camGoal.z, -7.5, 3.0); }
    else camGoal.z = clamp(camGoal.z, 1.3, 13.4);
    if (!camInit) { camera.position.copy(camGoal); camInit = true; }
    camera.position.lerp(camGoal, 1 - Math.exp(-dt * 5));
    camera.lookAt(cam.target);
    const ax = camera.position.x, az = camera.position.z, bx = S.pos.x - ax, bz = S.pos.z - az, bl = bx * bx + bz * bz;
    for (const fp of fadePoles) {
      const t = clamp(((fp.x - ax) * bx + (fp.z - az) * bz) / bl, 0, 1);
      const d = Math.hypot(ax + bx * t - fp.x, az + bz * t - fp.z);
      fp.o = damp(fp.o, t > 0.02 && t < 0.98 && d < 0.75 ? 0.15 : 1, 6, dt);
      for (const m of fp.mats) { m.opacity = fp.o; m.depthWrite = fp.o > 0.9; }
    }
  }

  function updateFx(dt) {
    for (const q of puffs) {
      if (!q.s.visible) continue;
      q.life += dt;
      const k = q.life / q.max;
      if (k >= 1) { q.s.visible = false; continue; }
      q.s.position.y += dt * 0.22; q.s.position.x += q.vx * dt; q.s.position.z += q.vz * dt;
      const sc = 0.05 + k * 0.22; q.s.scale.set(sc, sc, sc);
      q.s.material.opacity = Math.sin(k * Math.PI) * 0.22 * q.str;
    }
    for (let i = 0; i < DRIPS; i++) {
      if (dripPos[i * 3 + 1] < -10) continue;
      dripVel[i] += 9.8 * dt; dripPos[i * 3 + 1] -= dripVel[i] * dt;
      if (dripPos[i * 3 + 1] <= 0.02) {
        if (dripPos[i * 3 + 2] > 0.05 && rand() < 0.35) addStep(dripPos[i * 3], dripPos[i * 3 + 2], 0.25);
        dripPos[i * 3 + 1] = -50;
      }
    }
    dripGeo.attributes.position.needsUpdate = true;
    for (const f of flags) {
      const p = f.geo.attributes.position, b = f.base;
      for (let i = 0; i < p.count; i++) { const x = b[i * 3] + 0.21, y = b[i * 3 + 1]; p.setZ(i, Math.sin(clock * 2.1 + f.ph + x * 6 + y * 1.5) * 0.045 * (x / 0.42)); }
      p.needsUpdate = true; f.geo.computeVertexNormals();
    }
    for (const bl of blinkers) bl.visible = (clock * 0.8 + bl.position.x * 0.01) % 2 < 0.35;
    markerT += dt;
    marker.material.opacity = markerT < 0.8 ? (1 - markerT / 0.8) * 0.85 : 0;
    marker.scale.setScalar(0.7 + Math.min(markerT, 0.8) * 0.9);
    if (hintRing.visible) { const k = (clock * 0.8) % 1; hintRing.scale.setScalar(0.8 + k * 0.6); hintRing.material.opacity = (1 - k) * 0.7; }
    if (audio.on) {
      const t = audio.ctx.currentTime;
      audio.lp.frequency.setTargetAtTime(S.inside ? 650 : 3200, t, 0.4);
      audio.rainGain.gain.setTargetAtTime(S.inside ? 0.32 : 0.55, t, 0.4);
    }
  }

  // ================================================================ RESIZE + LOOP
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); composer.setSize(w, h); bloom.setSize(w * DPR, h * DPR);
    camera.aspect = w / h; camera.fov = w < h ? 55 : 42; camera.updateProjectionMatrix();
    refl.getRenderTarget().setSize(Math.round(w * DPR * reflScale), Math.round(h * DPR * reflScale));
  }
  addEventListener('resize', resize); resize();

  // debug / automation hook
  window.__konbini = { goTo: (x, z) => goTo(x, z, null), interact: (k) => goTo(INTERACT[k].stand[0], INTERACT[k].stand[1], INTERACT[k]), state: S, cam, door, car, step: (n, dt = 1 / 30) => { for (let i = 0; i < n; i++) tick(dt); } };

  function tick(dt) {
    clock += dt;
    rainUniforms.uTime.value = clock;
    refl.material.uniforms.uTime.value = clock;
    updateGirl(dt); updateDoor(dt); updateShop(dt); updateCar(dt); updateCamera(dt); updateFx(dt);
  }
  let last = performance.now(), firstFrame = true, slowAcc = 0, slowN = 0;
  function adapt(rawDt) {
    // drop resolution step by step if the device can't keep ~40fps
    slowAcc += rawDt; slowN++;
    if (slowN < 90) return;
    const avg = slowAcc / slowN; slowAcc = 0; slowN = 0;
    if (avg > 1 / 38 && DPR > 0.75) { DPR = Math.max(0.75, DPR - 0.2); renderer.setPixelRatio(DPR); composer.setPixelRatio(DPR); resize(); }
  }
  function frame(now) {
    const raw = (now - last) / 1000;
    const dt = Math.min(0.05, raw); last = now;
    if (!document.hidden) {
      if (!firstFrame && raw < 0.5) adapt(raw);
      tick(dt);
      updateBubbles(dt);
      composer.render(dt);
      if (firstFrame) { firstFrame = false; loadingEl.classList.add('done'); }
    }
    requestAnimationFrame(frame);
  }
  tick(0.016);
  requestAnimationFrame(frame);
}
</script>
